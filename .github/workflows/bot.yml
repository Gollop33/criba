name: radar-precios

# ─────────────────────────────────────────────────────────────────────────────
# CADENCIA: el `schedule` de GitHub NO sirve para publicar cada 7-8 min.
# Medido sobre las últimas 60 ejecuciones: gap mediano 174 min, mínimo 56 min,
# 58 de 59 gaps > 60 min (GitHub estrangula los crons de alta frecuencia).
#
# Estrategia (no necesita servicios externos):
#   `schedule` (5 veces/día) -> scrapea UNA vez y luego entra en
#   bucle_publicacion.py: publica un post cada 7.5 min durante ~4.5 h.
#   Como los disparos están a 3 h y el bucle dura 4.5 h, se solapan y la
#   cobertura de 8:00-22:00 BRT es continua. `concurrency` garantiza que
#   nunca haya dos publicando a la vez.
#
#   `workflow_dispatch` modo=publicar -> publica 1 solo post (manual / cron
#   externo si algún día se configura cron-job.org).
#
# Scrapear y publicar están separados a propósito: scrapear ML/Amazon cada
# 7.5 min haría que nos bloqueen la IP. El bucle NO scrapea.
# ─────────────────────────────────────────────────────────────────────────────
on:
  schedule:
    # TRES relojes en paralelo. GitHub se salta disparos cuando le da la gana
    # (medido: gap mediano de 174 min con */15), así que no podemos depender de
    # uno solo. Con varios, si falla uno los otros lo cubren.
    #
    #  1) */10 durante la ventana -> reanuda la publicación en cuanto abre (8:00 BRT)
    #  2) */10 en la hora de cierre -> por si la ventana se extiende
    #  3) 0 * * * * (cada hora, TODO el día) -> el paracaídas. Aunque GitHub
    #     descarte todos los demás, este dispara cada hora y a las 11:00 UTC
    #     (8:00 BRT) reanuda la publicación SOLO, sin que nadie toque nada.
    #     Fuera de la ventana el bucle sale en 1 segundo, así que no gasta nada.
    - cron: '*/10 11-23 * * *'
    - cron: '*/10 0 * * *'
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      modo:
        description: 'publicar = solo 1 post (cron externo) | full = pipeline completo'
        required: false
        default: 'publicar'
        type: choice
        options:
          - publicar
          - full
      bucle:
        description: 'si = entra al bucle de 5,5 h (reserva el job) | no = solo cosecha y sale'
        required: false
        default: 'si'
        type: choice
        options:
          - si
          - no

permissions:
  contents: write

# Evita que dos ejecuciones (cron externo + schedule) se pisen al hacer push.
concurrency:
  group: criba-bot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 358

    steps:
      - name: Modo de ejecución
        run: |
          echo "=== CRIBA Bot === $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "modo=${{ github.event.inputs.modo || 'full' }} evento=${{ github.event_name }}"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: dependencias
        run: pip install -r requirements.txt

      # ── Sincronizar estado ANTES de decidir si se publica ─────────────────
      # CRÍTICO: el checkout ocurre al inicio del run, pero el run anterior
      # puede haber publicado y pusheado DESPUÉS de ese checkout. Sin este pull,
      # `logs/enviados.json` llega viejo, la guardia MIN_GAP_MIN no ve el envío
      # reciente y se publica el MISMO producto dos veces (pasó el 2026-09-25).
      # Aquí el árbol todavía está limpio, así que un --ff-only basta.
      - name: sincronizar estado remoto (antes de publicar)
        run: |
          git config user.name "radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --ff-only origin main || echo "aviso: no se pudo fast-forward, se sigue con el estado del checkout"

      # ── RESET DIARIO: cierra el día anterior y abre el nuevo ──────────────
      # Se ejecuta el PRIMER run de cada día (hora de Brasilia). No depende de
      # que el cron caiga a las 08:00 exactas: si GitHub retrasa el schedule
      # (se midió una mediana de 174 min), el reset ocurre igual en cuanto el
      # bot vuelve a correr. Archiva el día anterior en logs/historial/, vacía
      # la fila para que se regenere con datos nuevos y marca los cupones
      # vencidos. NUNCA borra logs/enviados.json ni precios.db.
      - name: reset diario del ciclo
        continue-on-error: true
        run: python reset_diario.py
        env:
          HORA_RESET_BRT: "8"
          DIAS_TEMPORALES: "7"

      # ── Telegram: cupones y ofertas EN TIEMPO REAL ─────────────────────────
      # Lee el canal oficial de afiliados de Mercado Livre y los grupos de
      # ofertas donde esté el usuario. Los cupones de ML duran horas, así que
      # capturarlos al momento es dinero: antes había que copiarlos a mano.
      # Si no hay TELEGRAM_SESSION configurada, el script sale sin hacer nada.
      - name: leer telegram (cupones + ofertas)
        if: github.event.inputs.modo != 'publicar'
        continue-on-error: true
        run: python leer_telegram.py --horas 12
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}

      # ── CUPONES OFICIALES DE MERCADO LIVRE (/cupons) ───────────────────────
      # Es la fuente MÁS FRESCA de cupones y no depende de la sesión de
      # Telethon. Medido el 2026-10-07: 137 cupones en la página, de los que
      # 11 tienen código válido tras el filtro de higiene (el resto eran blobs
      # base64 de 88 caracteres del estado interno y fragmentos de texto).
      # Necesita ML_PORTAL_COOKIE (la misma sesión del portal).
      - name: cosechar cupones oficiales ML (cupons_ml)
        if: github.event.inputs.modo != 'publicar'
        continue-on-error: true
        run: python cupons_ml.py
        env:
          ML_PORTAL_COOKIE: ${{ secrets.ML_PORTAL_COOKIE }}

      # ── Pipeline PESADO: solo en modo full (schedule) ──────────────────────
      - name: actualizar cupones pelando
        if: github.event.inputs.modo != 'publicar'
        continue-on-error: true
        run: python cupones_pelando.py

      - name: cosechar mercado livre (agente_ml)
        if: github.event.inputs.modo != 'publicar'
        continue-on-error: true
        run: python agente_ml.py
        env:
          # CRÍTICO (2026-10-07): Mercado Livre dejó de servir la página de
          # ofertas a peticiones anónimas. Sin esta cookie el cosechador pasa de
          # 400 ofertas a 0 y el grupo se queda sin material (pasó el 5-6 de
          # octubre). Es la sesión del portal del usuario.
          ML_PORTAL_COOKIE: ${{ secrets.ML_PORTAL_COOKIE }}

      # Amazon bloquea las IPs de GitHub: aquí la cosecha devuelve 0 ofertas.
      # Desde el PC del usuario la misma cosecha trae ~300, así que Amazon se
      # cosecha en local (ACTUALIZAR_AMAZON.bat -> amazon_desde_pc.py) y el bot
      # lee el achados_amazon.json que se sube al repo.
      # Para activar ese modo: crear la variable de repositorio
      #   AMAZON_DESDE_PC = 1
      # (Settings -> Secrets and variables -> Actions -> Variables)
      - name: cosechar amazon brasil (agente_amazon)
        if: github.event.inputs.modo != 'publicar' && vars.AMAZON_DESDE_PC != '1'
        continue-on-error: true
        run: python agente_amazon.py

      # ── Shopee: 3 fuentes, de la mejor a la más humilde ────────────────────
      #   1. API oficial (si hay SHOPEE_APP_ID + SHOPEE_SECRET_KEY).
      #   2. Feed del portal (shopee_feed.csv en el repo).
      #   3. Grupos de ofertas de Telegram (método BlueBot): usa el
      #      `ofertas_telegram.json` que acaba de escribir el paso de Telegram
      #      unas líneas más arriba, resuelve cada enlace de Shopee y lo
      #      RECONVIERTE a la cuenta del afiliado con /an_redir + affiliate_id.
      # Sin SHOPEE_AFFILIATE_ID no se genera ningún enlace (y sin enlace que
      # cobre, el script no escribe nada). No se hace scraping de Shopee:
      # devuelve 403; el título y la foto se leen de los metas og:, que Shopee
      # sí sirve a los crawlers.
      - name: cosechar shopee (API afiliados / feed / grupos)
        if: github.event.inputs.modo != 'publicar'
        continue-on-error: true
        run: python agente_shopee.py
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET_KEY: ${{ secrets.SHOPEE_SECRET_KEY }}
          SHOPEE_AFFILIATE_ID: ${{ secrets.SHOPEE_AFFILIATE_ID }}
          SHOPEE_PAGOS_APROBADOS: ${{ secrets.SHOPEE_PAGOS_APROBADOS }}

      - name: unir achados do dia (unir_achados)
        if: github.event.inputs.modo != 'publicar'
        continue-on-error: true
        run: python unir_achados.py

      - name: agente autonomo de ofertas api (agente_autonomo)
        if: github.event.inputs.modo != 'publicar'
        continue-on-error: true
        run: python agente_autonomo.py
        env:
          DEALEE_API_KEY: ${{ secrets.DEALEE_API_KEY }}
          DEALEE_API_URL: ${{ secrets.DEALEE_API_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Capa de IA intercambiable: sirve cualquiera (deepseek, groq, openai,
          # gemini, anthropic, openrouter). Basta con poner AI_PROVIDER + AI_API_KEY.
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}

      - name: enriquecer ofertas ml con meli.la (gerador_melila)
        if: github.event.inputs.modo != 'publicar'
        continue-on-error: true
        run: python gerador_melila.py --lote
        env:
          ML_PORTAL_COOKIE: ${{ secrets.ML_PORTAL_COOKIE }}

      - name: acortar enlaces con tracking (acortador)
        if: github.event.inputs.modo != 'publicar'
        continue-on-error: true
        run: python acortador.py

      # ── WEB ESTÁTICA: ofertas DENTRO del HTML ──────────────────────────────
      # El 2026-10-08 Awin RECHAZÓ una solicitud con el motivo "URL inativo,
      # página não encontrada". El sitio estaba perfecto... pero las ofertas se
      # pintaban con JavaScript, así que un revisor automático veía el HTML
      # vacío (0 precios). Esto escribe las tarjetas REALES dentro de
      # index.html y ofertas.html. El JS sigue funcionando: al cargar, las
      # reemplaza por la versión dinámica.
      - name: generar web estática (ofertas sin JavaScript)
        continue-on-error: true
        run: python generar_web_estatica.py

      # ── COSECHA DE RESCATE (solo en modo publicar) ────────────────────────
      # Medido el 2026-10-08 con el cron externo ya activo: de los últimos 30
      # runs, 15 fueron CANCELADOS. El motivo es el `concurrency`: mientras un
      # run está en el bucle de 5,5 h, los demás quedan pendientes y GitHub va
      # cancelando los viejos. El cronjob de cosecha por hora casi nunca llegaba
      # a ejecutarse, así que achados.json solo se refrescaba cada ~5,5 h.
      # Este paso cosecha SOLO si el material tiene más de 3 h, usando el reloj
      # de cada 7 minutos que ya está funcionando.
      - name: cosechar si los achados estan viejos
        if: github.event.inputs.modo == 'publicar'
        continue-on-error: true
        run: python cosechar_si_viejo.py
        env:
          ML_PORTAL_COOKIE: ${{ secrets.ML_PORTAL_COOKIE }}

      # ── Pipeline LIGERO: siempre (también en modo publicar) ───────────────
      - name: generar fila rotativa de posts (gerar_fila_posts)
        continue-on-error: true
        run: python gerar_fila_posts.py
        env:
          # 12h (antes 24): el mismo producto no vuelve al grupo hasta 12h
          # después, y solo antes si BAJÓ de precio (ver HORAS_MIN_REPETIR).
          # Es la regla que evita el "4 veces la misma creatina" que reportó el
          # usuario el 2026-10-07.
          HORAS_ENFRIAMIENTO: "12"
          # FRESCURA: solo se publica lo confirmado hace menos de 12 h. Si la
          # cosecha de una tienda se rompe, sus ofertas caducan aquí solas en
          # vez de seguir publicándose como si fueran de hoy.
          MAX_EDAD_HORAS: "12"
          # REPETICIÓN POR PRECIO: repetir un producto NO es spam si el precio
          # bajó. 3h de suelo anti-spam + 3% de mejora mínima para readmitirlo.
          # El post sale con el sello "📉 BAJÓ DE PRECIO: antes R$ X".
          HORAS_MIN_REPETIR: "3"
          MEJORA_MIN_PCT: "3"
          # 'geral' = achadinhos (casa, limpieza, higiene, suplementos, pet...).
          # Medido: el modo 'tech' dejaba la fila en 14 posts y las 29 ofertas
          # de Amazon caian TODAS -> 0 publicaciones de Amazon en el grupo.
          # Con 'geral': 51 posts, 25 ML + 26 Amazon, 51 con cupon.
          # Pon 'tech' para volver al nicho cerrado original.
          NICHO_MODO: "geral"
          # Tandas de cupón al frente de la fila. Antes se generaban y se
          # TIRABAN (solo se contaban): el canal nunca publicó una. Ahora entran
          # de verdad, limitadas para que la fila no sea 100% cupones.
          MAX_LOTES_CUPON_FILA: "2"

      # ── Comparador multi-tienda ───────────────────────────────────────────
      # Cruza la fila con el historial de precios de 8 tiendas (precios.db) y
      # marca los posts que están MÁS BARATOS que en otras tiendas -> el post
      # sale con "🏆 MAIS BARATO QUE NAS OUTRAS LOJAS".
      # Además escribe productos_monitor.json para que bot_precios.py vigile lo
      # que realmente se publica: así la comparación gana cobertura cada día.
      - name: comparador multi-tienda
        continue-on-error: true
        run: python comparador_precios.py
        env:
          MAX_MONITOR: "60"

      # ── Renovar el token de ML (dura 6 h) ─────────────────────────────────
      # El access_token de Mercado Livre caduca cada 6 horas. Con el
      # refresh_token se renueva sin navegador ni intervención humana. Si no hay
      # refresh_token (o falla), el paso no rompe nada: el verificador
      # simplemente se salta la verificación.
      - name: renovar token de Mercado Livre
        if: github.event.inputs.modo != 'publicar'
        continue-on-error: true
        run: python obtener_token_ml.py --renovar
        env:
          ML_APP_ID: ${{ secrets.ML_APP_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}

      # ── Verificador real de producto (necesita ML_ACCESS_TOKEN) ───────────
      # Comprueba precio, stock y Pix contra la API OFICIAL de Mercado Livre.
      # Sin token no hace nada: ML bloquea el acceso anónimo (403) y las fichas
      # se renderizan con JavaScript, así que NO hay forma anónima de verificar.
      # El token es gratis en developers.mercadolibre.com/devcenter
      - name: verificar productos ML (API oficial)
        if: github.event.inputs.modo != 'publicar'
        continue-on-error: true
        run: python verificar_producto.py --fila
        env:
          ML_ACCESS_TOKEN: ${{ secrets.ML_ACCESS_TOKEN }}

      # ── Pruebas del validador: que no se publiquen combinaciones malas ────
      # 20 escenarios: cupón de otra tienda, cupón de otra categoría, cupón
      # vencido, enlace equivocado, enlace /go/, PIX inventado, datos viejos...
      - name: pruebas del validador
        continue-on-error: true
        run: python probar_validador.py

      # ── Pruebas de Amazon (offline) ───────────────────────────────────────
      # Vigilan la Regla nº1: que no se publique un precio inventado. El bug de
      # 2026-10-02 (precio fijo 89,90 en campañas de Pelando) queda cubierto.
      - name: pruebas de amazon (offline)
        continue-on-error: true
        run: python probar_amazon.py

      # ── Pruebas de Shopee (offline, no gastan cuota de la API) ────────────
      # Firma SHA256, construcción de las consultas GraphQL, traducción de una
      # oferta y la Regla de Oro del unificador y de la fila.
      - name: pruebas de shopee (offline)
        continue-on-error: true
        run: python probar_shopee_api.py

      # ── Pruebas del carril de cupones (offline) ───────────────────────────
      # 37 escenarios: blobs base64 de ML rechazados, descuento NUNCA
      # inventado, título-dict normalizado, cupón caducado fuera, /go/ sin tag
      # fuera, bootstrap sin spam, topes por hora/día y la tanda de cupón
      # entrando de verdad en la fila (antes se generaba y se tiraba).
      - name: pruebas de cupones (offline)
        continue-on-error: true
        run: python probar_cupones.py

      # ── Auditoría de la fila con el validador (deja rastro en el log) ─────
      - name: auditar la fila con el validador
        continue-on-error: true
        run: python validador_oferta.py --auditar

      # ── Redes sociales: Facebook Página + Instagram ───────────────────────
      # API OFICIAL de Meta. Se publica 1 achado por ejecución (~5 al día), que
      # en redes es lo sensato: más parecería spam.
      # Sin credenciales el módulo sale solo y no rompe nada.
      - name: publicar en redes (Facebook + Instagram)
        if: github.event.inputs.modo != 'publicar'
        continue-on-error: true
        run: python publicar_redes.py
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}

      # ── Publicación ───────────────────────────────────────────────────────
      # El `schedule` entra en BUCLE: publica cada 7.5 min hasta ~4.5 h, así la
      # cadencia no depende del cron (que GitHub estrangula a ~3 h).
      # Un `workflow_dispatch` (cron externo / manual) publica UN solo post.
      #
      # `bucle=no` (cron externo cada hora): cosecha, regenera la fila y SALE sin
      # reservar el job 5,5 h. Es lo que permite tener un disparador frecuente
      # sin llenar la cola de ejecuciones largas (concurrency solo deja una
      # corriendo y el resto espera).
      - name: publicar en bucle (cadencia 7-8 min)
        if: github.event.inputs.modo != 'publicar' && github.event.inputs.bucle != 'no'
        continue-on-error: true
        run: python bucle_publicacion.py
        env:
          GREEN_API_ID: ${{ secrets.GREEN_API_ID }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          WHATSAPP_CHAT_ID: ${{ secrets.WHATSAPP_CHAT_ID }}
          ML_PORTAL_COOKIE: ${{ secrets.ML_PORTAL_COOKIE }}
          MIN_GAP_MIN: "6"
          # Intervalos ALEATORIOS de 1 a 10 min (media 5.5 -> ~11 posts/hora).
          # Un patrón fijo es lo que detectan los anti-spam; la irregularidad
          # imita a una persona. El bucle baja MIN_GAP_MIN a 0.5 para que los
          # intervalos cortos no se bloqueen.
          INTERVALO_MIN_SEG: "60"
          INTERVALO_MAX_SEG: "600"
          # 5.5 h: el máximo seguro antes del límite de 6 h por job de GitHub.
          # Un solo disparo cubre casi toda la ventana (8:00-22:00 BRT = 14 h),
          # así que con 2-3 ejecuciones al día hay cobertura completa.
          DURACION_MAX_SEG: "19800"
          # 24/7: el bot ya no se apaga de noche. La ventana pasa a ser el día
          # completo y el ritmo nocturno lo fija bucle_publicacion.py (20-40 min
          # por post entre las 23h y las 7h BRT) para no parecer un robot ni
          # quemar el tope diario.
          VENTANA_BRT: "0-24"
          MODO_24H: "1"
          # Tope diario subido de 150 a 220 porque ahora también cubre la noche.
          MAX_ENVIOS_DIA: "220"
          # ── CARRIL RÁPIDO DE CUPONES ────────────────────────────────────────
          # Mientras este job vive, cada 5 min se mira si Mercado Livre soltó un
          # cupón nuevo y se publica al momento. Es lo que hace la competencia a
          # las 12 de la noche; antes solo se miraba en los runs "full" (gap
          # mediano de GitHub: 174 min), así que un cupón de las 00:05 salía a
          # las 3:00 o no salía.
          CHEQUEO_CUPONES_SEG: "300"
          CUPONES_FRESCURA_HORAS: "24"
          MAX_CUPONES_HORA: "3"
          MAX_CUPONES_DIA: "15"
          CUPON_MIN_GAP_MIN: "3"

      - name: publicar 1 post (dispatch)
        if: github.event.inputs.modo == 'publicar'
        continue-on-error: true
        run: python publicar_proximo.py
        env:
          GREEN_API_ID: ${{ secrets.GREEN_API_ID }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          WHATSAPP_CHAT_ID: ${{ secrets.WHATSAPP_CHAT_ID }}
          ML_PORTAL_COOKIE: ${{ secrets.ML_PORTAL_COOKIE }}
          MIN_GAP_MIN: "6"
          # El disparo manual/externo también publica a cualquier hora.
          VENTANA_BRT: "0-24"

      # ── Post-proceso: solo en modo full ───────────────────────────────────
      - name: buscar precios
        if: github.event.inputs.modo != 'publicar'
        continue-on-error: true
        run: python bot_precios.py

      - name: alertas telegram
        if: github.event.inputs.modo != 'publicar'
        continue-on-error: true
        run: python alertas_telegram.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # ── Commit y push ─────────────────────────────────────────────────────
      #
      # El `git pull --rebase --autostash` puede dejar marcadores de conflicto
      # dentro de un JSON. Si eso se commitea, `logs/enviados.json` deja de
      # parsear y el bot republica TODO el catálogo. Por eso:
      #   1) pull
      #   2) reparar_estado.py  -> une enviados.json / restaura el resto
      #   3) validar que ningún .json quedó con marcadores ANTES de commitear
      # ── SEO: sitemap fresco ───────────────────────────────────────────────
      # El sitemap es lo primero que leen los buscadores al llegar. Sin él,
      # Google tarda semanas en encontrar las páginas. El `lastmod` es la señal
      # de frescura: un sitio de ofertas que se actualiza cada hora tiene que
      # decirlo, o Google lo trata como contenido muerto.
      - name: actualizar sitemap (SEO)
        continue-on-error: true
        run: python actualizar_sitemap.py

      - name: commit y push resultados
        run: |
          git config user.name "radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A -- '*.json' '*.html' go/ img/ logs/ precios.db || true
          git pull --rebase --autostash origin main || git pull origin main || true

          echo "── reparando estado si hay conflictos ──"
          python reparar_estado.py || true

          echo "── validando que ningun JSON este corrupto ──"
          python reparar_estado.py --check || {
            echo "ERROR: quedan JSON con marcadores de conflicto; NO se commitea.";
            exit 1;
          }

          git add -A -- '*.json' '*.html' go/ img/ logs/ precios.db || true
          git diff --staged --quiet || git commit -m "auto: achados+fila+cupons $(date -u +%H:%M)"
          git push || git push --force-with-lease
