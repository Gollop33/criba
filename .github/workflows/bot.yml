name: radar-precios

on:
  schedule:
    - cron: '0 11-23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - name: Log ejecucion
        run: echo "=== CRIBA Bot === $(date -u '+%Y-%m-%d %H:%M:%S UTC') ==="

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: dependencias
        run: pip install requests beautifulsoup4 Pillow

      - name: actualizar cupones pelando
        continue-on-error: true
        run: python cupones_pelando.py

      - name: cosechar mercado livre (agente_ml)
        continue-on-error: true
        run: python agente_ml.py

      - name: cosechar amazon brasil (agente_amazon)
        continue-on-error: true
        run: python agente_amazon.py

      - name: unir achados do dia (unir_achados)
        continue-on-error: true
        run: python unir_achados.py

      - name: buscar precios
        run: python bot_precios.py

      # - name: pipeline imagenes (desactivado: usamos URLs externas originales directas)
      #   continue-on-error: true
      #   run: python descargar_imagenes.py
      #   env:
      #     TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      #     TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: enviar ofertas whatsapp
        continue-on-error: true
        run: python enviar_whatsapp.py
        env:
          GREEN_API_ID: ${{ secrets.GREEN_API_ID }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          WHATSAPP_CHAT_ID: ${{ secrets.WHATSAPP_CHAT_ID }}

      - name: alertas telegram
        continue-on-error: true
        run: python alertas_telegram.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: publicar
        run: |
          git config user.name "radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --rebase origin main || true
          git add productos.json cupones.json achados.json img/ logs/ faltantes_imagenes.json || true
          git diff --quiet && git diff --staged --quiet || git commit -m "auto: achados+precios+cupons $(date -u +%H:%M)"
          git push
