name: radar-precios

on:
  schedule:
    # Cada 15 minutos en horario pico Brasil (11:00 a 23:45 UTC = ~8:00 a 20:45 Brasília)
    - cron: '*/15 11-23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - name: Log ejecucion
        run: echo "=== CRIBA Bot === $(date -u '+%Y-%m-%d %H:%M:%S UTC') ==="

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: dependencias
        run: pip install requests beautifulsoup4 Pillow playwright

      - name: actualizar cupones pelando
        continue-on-error: true
        run: python cupones_pelando.py

      - name: cosechar mercado livre (agente_ml)
        continue-on-error: true
        run: python agente_ml.py

      - name: cosechar amazon brasil (agente_amazon)
        continue-on-error: true
        run: python agente_amazon.py

      - name: unir achados do dia (unir_achados)
        continue-on-error: true
        run: python unir_achados.py

      - name: enriquecer ofertas ml con meli.la (gerador_melila)
        continue-on-error: true
        run: |
          playwright install chromium || true
          python gerador_melila.py --lote
        env:
          ML_PORTAL_COOKIE: ${{ secrets.ML_PORTAL_COOKIE }}

      - name: acortar enlaces con tracking (acortador)
        continue-on-error: true
        run: python acortador.py

      - name: generar fila rotativa de posts (gerar_fila_posts)
        continue-on-error: true
        run: python gerar_fila_posts.py

      - name: publicar proximo post modo canal (publicar_proximo)
        continue-on-error: true
        run: python publicar_proximo.py
        env:
          GREEN_API_ID: ${{ secrets.GREEN_API_ID }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          WHATSAPP_CHAT_ID: ${{ secrets.WHATSAPP_CHAT_ID }}

      - name: buscar precios
        run: python bot_precios.py

      - name: alertas telegram
        continue-on-error: true
        run: python alertas_telegram.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: publicar
        run: |
          git config user.name "radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --rebase origin main || true
          git add productos.json cupones.json achados.json achados_especificos.json fila_posts.json links.json melila_cache.json go/ img/ logs/ faltantes_imagenes.json || true
          git diff --quiet && git diff --staged --quiet || git commit -m "auto: achados+fila+cupons $(date -u +%H:%M)"
          git push
