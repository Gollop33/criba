name: radar-precios
on:
  schedule: [{cron: "*/30 * * * *"}]
  workflow_dispatch: {}
jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - name: buscar precios
        run: python bot_precios.py
      - name: enviar alertas telegram
        run: python alertas_telegram.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: publicar
        run: |
          git config user.name "radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add productos.json
          git diff --quiet && git diff --staged --quiet || git commit -m "precios $(date -u +%H:%M)"
          git push
