<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(23, 21, 15, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Fondo estructurado -->
  <rect width="400" height="300" rx="16" fill="url(#bgGrad)"/>
  <rect width="400" height="300" rx="16" fill="url(#grid)"/>
  <rect x="2" y="2" width="396" height="296" rx="14" fill="none" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Logo CRIBA watermark sutil -->
  <g transform="translate(24, 24)">
    <text x="0" y="16" font-family="'Archivo Black', -apple-system, sans-serif" font-size="16" font-weight="900" fill="#17150F" letter-spacing="-0.5px">CRIBA<tspan fill="#FF4D12">.</tspan></text>
    <text x="0" y="28" font-family="'Space Mono', monospace" font-size="7.5" font-weight="700" fill="#64748B" letter-spacing="1.5px">RADAR DE PREÇOS</text>
  </g>

  <!-- Badge Verificado -->
  <g transform="translate(290, 20)">
    <rect width="86" height="22" rx="11" fill="#FFFFFF" stroke="#17150F" stroke-width="1.5"/>
    <circle cx="12" cy="11" r="4" fill="#14724A"/>
    <text x="22" y="14.5" font-family="'Space Mono', monospace" font-size="8" font-weight="700" fill="#17150F">ORIGINAL</text>
  </g>

  <!-- ICONO SILUETA DE LA CATEGORÍA -->
  <g id="illustration">
    <!-- Caja / Paquete con sello -->
        <path d="M140,110 L200,80 L260,110 L200,140 Z" fill="#FFFFFF" stroke="#17150F" stroke-width="3" />
        <path d="M140,110 L140,180 L200,210 L200,140 Z" fill="#F8FAFC" stroke="#17150F" stroke-width="3" />
        <path d="M260,110 L260,180 L200,210 L200,140 Z" fill="#F1F5F9" stroke="#17150F" stroke-width="3" />
        <!-- Cinta del paquete -->
        <line x1="200" y1="80" x2="200" y2="210" stroke="#FF4D12" stroke-width="3" />
        <circle cx="200" cy="140" r="14" fill="#14724A" stroke="#17150F" stroke-width="2" />
        <path d="M194,140 L198,144 L206,136" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- ETIQUETA CATEGORÍA INFERIOR -->
  <g transform="translate(0, 260)">
    <rect x="110" y="0" width="180" height="24" rx="12" fill="#17150F" />
    <text x="200" y="15" font-family="'Space Mono', monospace" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5px">PRODUTO VERIFICADO</text>
  </g>
</svg>