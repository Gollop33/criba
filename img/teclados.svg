<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(23, 21, 15, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Fondo estructurado -->
  <rect width="400" height="300" rx="16" fill="url(#bgGrad)"/>
  <rect width="400" height="300" rx="16" fill="url(#grid)"/>
  <rect x="2" y="2" width="396" height="296" rx="14" fill="none" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Logo CRIBA watermark sutil -->
  <g transform="translate(24, 24)">
    <text x="0" y="16" font-family="'Archivo Black', -apple-system, sans-serif" font-size="16" font-weight="900" fill="#17150F" letter-spacing="-0.5px">CRIBA<tspan fill="#FF4D12">.</tspan></text>
    <text x="0" y="28" font-family="'Space Mono', monospace" font-size="7.5" font-weight="700" fill="#64748B" letter-spacing="1.5px">RADAR DE PREÇOS</text>
  </g>

  <!-- Badge Verificado -->
  <g transform="translate(290, 20)">
    <rect width="86" height="22" rx="11" fill="#FFFFFF" stroke="#17150F" stroke-width="1.5"/>
    <circle cx="12" cy="11" r="4" fill="#14724A"/>
    <text x="22" y="14.5" font-family="'Space Mono', monospace" font-size="8" font-weight="700" fill="#17150F">ORIGINAL</text>
  </g>

  <!-- ICONO SILUETA DE LA CATEGORÍA -->
  <g id="illustration">
    <!-- Teclado silueta -->
        <rect x="80" y="90" width="240" height="120" rx="14" fill="#FFFFFF" stroke="#17150F" stroke-width="3" />
        <!-- Teclas fila 1 -->
        <rect x="100" y="105" width="22" height="18" rx="3" fill="#F1F5F9" stroke="#17150F" stroke-width="2"/>
        <rect x="130" y="105" width="22" height="18" rx="3" fill="#F1F5F9" stroke="#17150F" stroke-width="2"/>
        <rect x="160" y="105" width="22" height="18" rx="3" fill="#F1F5F9" stroke="#17150F" stroke-width="2"/>
        <rect x="190" y="105" width="22" height="18" rx="3" fill="#F1F5F9" stroke="#17150F" stroke-width="2"/>
        <rect x="220" y="105" width="22" height="18" rx="3" fill="#F1F5F9" stroke="#17150F" stroke-width="2"/>
        <rect x="250" y="105" width="48" height="18" rx="3" fill="#FF4D12" stroke="#17150F" stroke-width="2"/>
        <!-- Teclas fila 2 -->
        <rect x="100" y="132" width="28" height="18" rx="3" fill="#F1F5F9" stroke="#17150F" stroke-width="2"/>
        <rect x="136" y="132" width="22" height="18" rx="3" fill="#F1F5F9" stroke="#17150F" stroke-width="2"/>
        <rect x="166" y="132" width="22" height="18" rx="3" fill="#F1F5F9" stroke="#17150F" stroke-width="2"/>
        <rect x="196" y="132" width="22" height="18" rx="3" fill="#F1F5F9" stroke="#17150F" stroke-width="2"/>
        <rect x="226" y="132" width="22" height="18" rx="3" fill="#F1F5F9" stroke="#17150F" stroke-width="2"/>
        <rect x="256" y="132" width="42" height="18" rx="3" fill="#F1F5F9" stroke="#17150F" stroke-width="2"/>
        <!-- Teclas fila 3 (espacio) -->
        <rect x="100" y="160" width="36" height="20" rx="3" fill="#F1F5F9" stroke="#17150F" stroke-width="2"/>
        <rect x="144" y="160" width="112" height="20" rx="3" fill="#FFFFFF" stroke="#17150F" stroke-width="2"/>
        <rect x="264" y="160" width="34" height="20" rx="3" fill="#F1F5F9" stroke="#17150F" stroke-width="2"/>
  </g>

  <!-- ETIQUETA CATEGORÍA INFERIOR -->
  <g transform="translate(0, 260)">
    <rect x="110" y="0" width="180" height="24" rx="12" fill="#17150F" />
    <text x="200" y="15" font-family="'Space Mono', monospace" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5px">TECLADO</text>
  </g>
</svg>