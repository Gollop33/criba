<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(23, 21, 15, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Fondo estructurado -->
  <rect width="400" height="300" rx="16" fill="url(#bgGrad)"/>
  <rect width="400" height="300" rx="16" fill="url(#grid)"/>
  <rect x="2" y="2" width="396" height="296" rx="14" fill="none" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Logo CRIBA watermark sutil -->
  <g transform="translate(24, 24)">
    <text x="0" y="16" font-family="'Archivo Black', -apple-system, sans-serif" font-size="16" font-weight="900" fill="#17150F" letter-spacing="-0.5px">CRIBA<tspan fill="#FF4D12">.</tspan></text>
    <text x="0" y="28" font-family="'Space Mono', monospace" font-size="7.5" font-weight="700" fill="#64748B" letter-spacing="1.5px">RADAR DE PREÇOS</text>
  </g>

  <!-- Badge Verificado -->
  <g transform="translate(290, 20)">
    <rect width="86" height="22" rx="11" fill="#FFFFFF" stroke="#17150F" stroke-width="1.5"/>
    <circle cx="12" cy="11" r="4" fill="#14724A"/>
    <text x="22" y="14.5" font-family="'Space Mono', monospace" font-size="8" font-weight="700" fill="#17150F">ORIGINAL</text>
  </g>

  <!-- ICONO SILUETA DE LA CATEGORÍA -->
  <g id="illustration">
    <!-- Diadema -->
        <path d="M130,150 C130,90 155,65 200,65 C245,65 270,90 270,150" fill="none" stroke="#17150F" stroke-width="6" stroke-linecap="round" />
        <path d="M145,140 C145,98 165,80 200,80 C235,80 255,98 255,140" fill="none" stroke="#CBD5E1" stroke-width="3" />
        <!-- Almohadilla izquierda -->
        <rect x="110" y="140" width="36" height="65" rx="14" fill="#FFFFFF" stroke="#17150F" stroke-width="3" />
        <!-- Almohadilla derecha -->
        <rect x="254" y="140" width="36" height="65" rx="14" fill="#FFFFFF" stroke="#17150F" stroke-width="3" />
        <!-- Microfono -->
        <path d="M125,190 C125,230 170,230 185,225" fill="none" stroke="#17150F" stroke-width="3" stroke-linecap="round" />
        <circle cx="190" cy="223" r="6" fill="#FF4D12" stroke="#17150F" stroke-width="2" />
  </g>

  <!-- ETIQUETA CATEGORÍA INFERIOR -->
  <g transform="translate(0, 260)">
    <rect x="110" y="0" width="180" height="24" rx="12" fill="#17150F" />
    <text x="200" y="15" font-family="'Space Mono', monospace" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5px">HEADSET GAMER</text>
  </g>
</svg>