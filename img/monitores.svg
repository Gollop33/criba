<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(23, 21, 15, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Fondo estructurado -->
  <rect width="400" height="300" rx="16" fill="url(#bgGrad)"/>
  <rect width="400" height="300" rx="16" fill="url(#grid)"/>
  <rect x="2" y="2" width="396" height="296" rx="14" fill="none" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Logo CRIBA watermark sutil -->
  <g transform="translate(24, 24)">
    <text x="0" y="16" font-family="'Archivo Black', -apple-system, sans-serif" font-size="16" font-weight="900" fill="#17150F" letter-spacing="-0.5px">CRIBA<tspan fill="#FF4D12">.</tspan></text>
    <text x="0" y="28" font-family="'Space Mono', monospace" font-size="7.5" font-weight="700" fill="#64748B" letter-spacing="1.5px">RADAR DE PREÇOS</text>
  </g>

  <!-- Badge Verificado -->
  <g transform="translate(290, 20)">
    <rect width="86" height="22" rx="11" fill="#FFFFFF" stroke="#17150F" stroke-width="1.5"/>
    <circle cx="12" cy="11" r="4" fill="#14724A"/>
    <text x="22" y="14.5" font-family="'Space Mono', monospace" font-size="8" font-weight="700" fill="#17150F">ORIGINAL</text>
  </g>

  <!-- ICONO SILUETA DE LA CATEGORÍA -->
  <g id="illustration">
    <!-- Pantalla -->
        <rect x="85" y="70" width="230" height="135" rx="8" fill="#FFFFFF" stroke="#17150F" stroke-width="3" />
        <rect x="95" y="80" width="210" height="110" rx="3" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
        <!-- Soporte columna -->
        <rect x="188" y="205" width="24" height="35" fill="#CBD5E1" stroke="#17150F" stroke-width="2" />
        <!-- Base pie -->
        <path d="M140,240 L200,225 L260,240" fill="none" stroke="#17150F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
        <!-- Tasa Hz -->
        <text x="200" y="140" font-family="'Space Mono', monospace" font-size="14" font-weight="bold" fill="#FF4D12" text-anchor="middle">144Hz IPS</text>
  </g>

  <!-- ETIQUETA CATEGORÍA INFERIOR -->
  <g transform="translate(0, 260)">
    <rect x="110" y="0" width="180" height="24" rx="12" fill="#17150F" />
    <text x="200" y="15" font-family="'Space Mono', monospace" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5px">MONITOR GAMER</text>
  </g>
</svg>