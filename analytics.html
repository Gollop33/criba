<!-- Google Analytics 4 - CRIBA -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-NFQTYQ0HXH"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-NFQTYQ0HXH', {
  page_path: window.location.pathname,
  anonymize_ip: true
});

// Rastrear clics en enlaces de afiliado con captura de ASIN
document.addEventListener('click', function(e) {
  const link = e.target.closest('a');
  if (!link) return;

  const href = link.getAttribute('href') || '';
  const texto = (link.textContent || '').trim().substring(0, 50);

  // Detecta enlaces de afiliado por patrones comunes
  const esAfiliado =
    href.includes('tag=') ||
    href.includes('affiliate') ||
    href.includes('afiliado') ||
    href.includes('aff=') ||
    href.includes('amazon.com') ||
    href.includes('mercadolivre') ||
    href.includes('mercadolivre.com.br') ||
    href.includes('mercadolibre') ||
    href.includes('shopee.com') ||
    href.includes('kabum.com') ||
    href.includes('pichau.com') ||
    href.includes('terabyteshop.com') ||
    href.includes('magazineluiza.com') ||
    href.includes('aliexpress.com') ||
    texto.toLowerCase().includes('mercado livre') ||
    link.classList.contains('aff') ||
    link.classList.contains('btn-aff');

  if (esAfiliado) {
    const eventData = {
      event_category: 'afiliado',
      event_label: texto,
      link_url: href,
      transport_type: 'beacon'
    };

    // Si es enlace de Amazon, extraer el ASIN
    if (href.includes('amazon.com')) {
      const asinMatch = href.match(/(?:\/dp\/|\/gp\/product\/)([A-Z0-9]{10})/i);
      if (asinMatch && asinMatch[1]) {
        eventData.asin = asinMatch[1].toUpperCase();
        eventData.plataforma = 'Amazon';
      }
    } else if (href.includes('mercadolivre') || href.includes('mercadolibre') || texto.toLowerCase().includes('mercado livre')) {
      eventData.plataforma = 'Mercado Livre';
    }

    gtag('event', 'click_afiliado', eventData);
  }
});

// Rastrear scroll al 75% de la página (usuario interesado)
let scrollSent = false;
window.addEventListener('scroll', function() {
  if (scrollSent) return;
  const scrolled = (window.scrollY + window.innerHeight) / document.body.scrollHeight;
  if (scrolled >= 0.75) {
    scrollSent = true;
    gtag('event', 'scroll_profundo', {
      event_category: 'engagement',
      percent: 75
    });
  }
}, {passive: true});

// Rastrear filtros de categorías (análisis, chollos, etc.)
document.addEventListener('DOMContentLoaded', function() {
  document.querySelectorAll('[data-filter], .chip, [data-goto]').forEach(el => {
    el.addEventListener('click', function() {
      gtag('event', 'filtro_categoria', {
        event_category: 'navegacion',
        filter_name: this.dataset.filter || this.dataset.goto || this.textContent.trim().substring(0,30)
      });
    });
  });
});
</script>
